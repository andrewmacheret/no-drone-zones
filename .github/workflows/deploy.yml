name: Deploy to S3

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      # The GeoJSON files are too big for CloudFront to compress, so gzip them here
      - name: Gzip GeoJSON
        run: |
          for f in www/*.geojson; do
            gzip -9 -n -c "$f" > "$f.gz"
            mv "$f.gz" "$f"
          done
      # Without a cache-control header, browsers can keep old files for months
      # Everything under projects/no-drone-zones comes from this repo, so --delete is safe
      - run: |
          aws s3 sync www s3://andrewmacheret.com/projects/no-drone-zones --delete \
            --exclude '*.geojson' --cache-control max-age=300
      - run: |
          aws s3 sync www s3://andrewmacheret.com/projects/no-drone-zones --delete \
            --exclude '*' --include '*.geojson' --cache-control max-age=300 \
            --content-type application/geo+json --content-encoding gzip
      - name: Invalidate CloudFront cache
        if: vars.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths '/projects/no-drone-zones/*'
