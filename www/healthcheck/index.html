<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!-- No analytics.js here, so the daily canary doesn't count as a visit -->
<title>Nearby No-Drone Zones health check</title>
<style>body { font-family: system-ui, sans-serif; margin: 2rem; } li { margin: 0.25rem 0; }</style>
<script src="https://andrewmacheret.com/healthcheck.js"></script>
</head>
<body>
<h1>Nearby No-Drone Zones health check</h1>
<script>
// The page loads Leaflet from unpkg and Turf from jsDelivr, so the page check covers them
healthcheck([
  { name: 'Page', url: '../', assets: true, contains: 'No-Drone Zones' },
  { name: 'No-drone zones API', url: 'https://no-drone-zones.andrewmacheret.com/healthcheck', healthcheck: true },
  { name: 'OpenStreetMap tiles', url: 'https://tile.openstreetmap.org/0/0/0.png', image: true }
]);
</script>
</body>
</html>
