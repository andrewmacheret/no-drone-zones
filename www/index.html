<!DOCTYPE html>
<html lang="en-US">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">

<!-- open graph -->
<meta property="og:url" content="https://andrewmacheret.com/projects/no-drone-zones/" />
<meta property="og:image" content="https://andrewmacheret.com/projects/no-drone-zones/screenshot.jpg" />
<meta property="og:title" content="Nearby No-Drone Zones" />
<meta property="og:description" content="Shows no-drone zones near your location." />
<meta property="og:type" content="website" />

<!-- title -->
<title>Nearby No-Drone Zones</title>
<script async src="https://andrewmacheret.com/analytics.js"></script>
<meta name="description" content="A map of the airport airspace, national security areas, prohibited areas and national parks near you where drones need permission or aren't allowed, from daily FAA and National Park Service data." />
<link rel="canonical" href="https://andrewmacheret.com/projects/no-drone-zones/" />

<!-- js libraries -->
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.4.0/turf.min.js" integrity="sha384-G+b+P1TXEQX2nQW+hvnd1dWiV2mysujghcENksJYyeXd0Z1Bp23Ac/6IRftCtdmI" crossorigin="anonymous"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<!-- custom js -->
<script src="geo.js"></script>
<script src="map.js"></script>
<script src="location-watcher.js"></script>
<script src="no-drone-zone.js"></script>
<script src="index.js"></script>

<!-- css -->
<!-- before Leaflet's CSS so Leaflet's own link and button colors win -->
<link rel="stylesheet" href="https://andrewmacheret.com/projects.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" type="text/css" href="index.css">
</head>

<body>
<div id="map"></div>

<aside id="panel" class="overlay">
  <header class="header">
    <img src="no-drone-zone.png" alt="" class="logo">
    <h1>Nearby No-Drone Zones</h1>
  </header>

  <ul id="legend" class="legend"></ul>

  <div id="status" class="status" role="status">Finding your location&hellip;</div>
  <div id="zoom-hint" class="hint" hidden>Zoom in to see zones on the map.</div>

  <div id="position" hidden>
    <div id="latitude"></div>
    <div id="longitude"></div>
    <div id="accuracy"></div>
    <div id="altitude"></div>
    <div id="altitudeAccuracy"></div>
    <div id="time"></div>
  </div>

  <details id="nearest-wrapper" hidden>
    <summary>Nearby zones <span id="nearest-count" class="count"></span></summary>
    <div class="fields">Within
      <input id="max-distance" value="50" type="number" min="0" max="200" aria-label="Distance">
      <select id="units" aria-label="Units">
        <option value="kilometers" selected="selected">km</option>
        <option value="miles">mi</option>
      </select>
    </div>
    <div id="nearest"></div>
  </details>

  <footer class="footer">
    <a href="https://andrewmacheret.com/">More projects</a>
    <span aria-hidden="true">&middot;</span>
    <span id="data-source">Zones from the FAA and National Park Service</span>
    <span aria-hidden="true">&middot;</span>
    <a href="https://github.com/andrewmacheret/no-drone-zones">Source</a>
  </footer>
</aside>
</body>
</html>
