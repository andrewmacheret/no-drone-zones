<!DOCTYPE html>
<html lang="en-US">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- open graph -->
<meta property="og:url" content="https://andrewmacheret.com/projects/no-drone-zones/" />
<meta property="og:image" content="https://andrewmacheret.com/projects/no-drone-zones/screenshot.jpg" />
<meta property="og:title" content="Nearby No-Drone Zones" />
<meta property="og:description" content="Shows no-drone zones near your location." />
<meta property="og:type" content="website" />

<!-- title -->
<title>Nearby No-Drone Zones</title>

<!-- js libraries -->
<script src="https://code.jquery.com/jquery-4.1.0.min.js" integrity="sha384-UGSi5euAzE1p4sK41+yKs3vtdPcidmaW6fY2NUITZkjIPyMVUUYB/BV4A5Oa8uu2" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.4.0/turf.min.js" integrity="sha384-G+b+P1TXEQX2nQW+hvnd1dWiV2mysujghcENksJYyeXd0Z1Bp23Ac/6IRftCtdmI" crossorigin="anonymous"></script>
<script src="https://maps.googleapis.com/maps/api/js?key=REMOVED"></script>

<!-- custom js -->
<script src="geo.js"></script>
<script src="map.js"></script>
<script src="location-watcher.js"></script>
<script src="no-drone-zone.js"></script>
<script src="index.js"></script>

<!-- css -->
<link rel="stylesheet" type="text/css" href="index.css">
</head>

<body>
<div id="body-wrapper">
  
  <div id="content">
    
    <div id="drone"><img src="no-drone-zone.png" alt="No drone zone sign"></div>
    
    <div id="position">
      <div id="position-header">Current location</div>
      <div id="latitude"></div>
      <div id="longitude"></div>
      <div id="accuracy"></div>
      <div id="altitude"></div>
      <div id="altitudeAccuracy"></div>
      <div id="time">Loading...</div>
    </div>

    <div id="nearest-wrapper">
      <div id="nearest-header">
        No-drone zones
      </div>

      <div id="fields">
        <div id="distance-wrapper">
          Within:
          <input id="max-distance" value="50" type="number" min="0">
        </div>
        <div id="units-wrapper">
          <select id="units">
            <option value="kilometers" selected="selected">kilometers</option>
            <option value="miles">miles</option>
          </select>
        </div>
      </div>
      
      <div id="nearest">Loading...</div>

    </div>

    <div id="source">Source: <a href="https://github.com/mapbox/drone-feedback/tree/master/sources/geojson">https://github.com/mapbox/drone-feedback/tree/master/sources/geojson</a></div>
  </div>

  <div id="map"></div>

</div>
</body>
</html>
